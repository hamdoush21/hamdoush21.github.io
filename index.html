<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMDOUSH</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top left,#6d28d9,transparent 35%),
        radial-gradient(circle at bottom right,#2563eb,transparent 35%),
        linear-gradient(135deg,#0f172a,#111827);
    color:white;
    overflow:hidden;
}

.container{
    width:390px;
    max-width:92%;
    text-align:center;
    padding:35px 25px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:28px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
    width:95px;
    height:95px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    font-size:24px;
    font-weight:bold;
    box-shadow:0 10px 35px rgba(37,99,235,.4);
}

h1{
    margin:0;
    font-size:38px;
    letter-spacing:3px;
}

.welcome{
    margin-top:12px;
    font-size:20px;
}

.sub{
    margin:10px 0 25px;
    color:#cbd5e1;
    font-size:15px;
}

a{
    display:block;
    text-decoration:none;
    color:white;
    padding:16px;
    margin:13px 0;
    border-radius:16px;
    font-size:17px;
    font-weight:bold;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    transition:.25s;
}

a:hover{
    transform:translateY(-3px) scale(1.02);
    background:rgba(255,255,255,.18);
}

.instagram:hover{
    box-shadow:0 8px 25px rgba(225,48,108,.35);
}

.tiktok:hover{
    box-shadow:0 8px 25px rgba(0,242,234,.25);
}

.facebook:hover{
    box-shadow:0 8px 25px rgba(24,119,242,.35);
}

.footer{
    margin-top:22px;
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">H</div>

    <h1>HAMDOUSH</h1>

    <div class="welcome">
        أهلاً وسهلاً بيك 👋
    </div>

    <div class="sub">
        هذني صفحاتي الرسمية 🔗
    </div>

    <a class="instagram"
       href="https://www.instagram.com/k22cn/"
       target="_blank">
       📸 Instagram
    </a>

    <a class="tiktok"
       href="https://www.tiktok.com/@m01ql"
       target="_blank">

    </a>

    <a class="facebook"
       href="https://www.facebook.com/MPQWG"
       target="_blank">
       📘 Facebook
    </a>

    <div class="footer">
        — HAMDOUSH —
    </div>

</div>

</body>
</html>
